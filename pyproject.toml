[build-system]
requires = ["poetry-core", "setuptools", "cython>=3.1"]
build-backend = "poetry.core.masonry.api"

[project]
name = "asynch"
version = "0.4.0"
description = "An asyncio driver for ClickHouse with native TCP support"
authors = [
    {name = "long2ice",email = "long2ice@gmail.com"}
]
license = {file = "LICENSE"}
readme = "README.md"
keywords = ["asyncio", "clickhouse", "python", "driver"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
requires-python = ">=3.11,<4.0"
dependencies = [
    "ciso8601>=2.3.2",
    "tzlocal>=5.3.1",
    # zoneinfo needs the IANA database, which Windows does not ship.
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Transport compression needs all of these: cityhash for the block checksums
# plus the codecs themselves. They used to be mandatory even though
# compression could not work without the (optional) cityhash, so every user
# installed two codec libraries they could not use.
# zstd is only needed below 3.14, which has it in the standard library.
compression = [
    "clickhouse-cityhash>=1.0.2.4",
    "lz4>=4.4.3",
    "zstd>=1.5.6.6; python_version < '3.14'",
]

[project.urls]
homepage = "https://github.com/long2ice/asynch"
repository = "https://github.com/long2ice/asynch.git"
documentation = "https://github.com/long2ice/asynch"

[dependency-groups]
dev = [
    "cython>=3.1",
    "mypy",
    "ruff",
    "stubgen-pyx>=0.2.18",
    "clickhouse-driver",
    "rich",
    "uvloop; sys_platform != 'win32' and implementation_name == 'cpython'",
]
test = [
    "pytest",
    "pytest-asyncio>=0.25",
    "pytest-random-order",
    "pytest-mock",
    "pytest-xdist",
]

[tool.poetry]
packages = [{ include = "asynch" }]
include = [
    "CHANGELOG.md",
    "LICENSE",
    "README.md",
    # PEP 561: without these the type information silently doesn't ship.
    { path = "asynch/py.typed", format = ["sdist", "wheel"] },
    { path = "asynch/**/*.pyi", format = ["sdist", "wheel"] },
]

[tool.poetry.build]
generate-setup-file = true
script = "build_cython.py"

[tool.mypy]
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
# TODO: re-enable after type hints improve:
# check_untyped_defs, no_implicit_reexport, warn_return_any, warn_unreachable

# Compiled modules are seen by mypy through their generated .pyi stubs, which
# stubtest already validates against the runtime. mypy's class-hierarchy
# inference over generated stubs (e.g. `ch_type = None` in the base vs a str
# in subclasses) is noise, not signal.
[[tool.mypy.overrides]]
module = [
    "asynch.cursors",
    "asynch.proto.connection",
    "asynch.proto.block",
    "asynch.proto.result",
    "asynch.proto.progress",
    "asynch.proto.streams.*",
    "asynch.proto.columns.*",
]
ignore_errors = true

[tool.pytest.ini_options]
addopts = [
    "--random-order"
]
asyncio_mode = "auto"
minversion = "8.3"
testpaths = ["tests"]
xfail_strict = true

[tool.ruff]
indent-width = 4
line-length = 100
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
    "A",  # flake8-builtins
    "ASYNC",  # flake8-async
    # "ANN",  # flake8-annotations
    # "B",  # flake8-bugbear
    "E",  # pycodestyle
    "ERA",  # eradicate
    "F",  # Pyflakes
    "I",  # isort
    "ICN",  # flake8-import-conventions
    "ISC",  # flake8-implicit-str-concat
    "PIE",  # flake8-pie
    "S",  # flake8-bandit
    "T10",  # flake8-debugger
    "T20",  # flake8-print
    "FA",  # flake8-future-annotations
    "UP",  # pyupgrade
    "RUF100"  # unused noqa
]
ignore = [
    "UP031",  # %-format is fine, and sometimes clearer than .format()
    "UP032",
]

[tool.ruff.lint.per-file-ignores]
"asynch/proto/settings/types.py" = ["A005"]
"*.pyi" = ["F403", "F405", "UP006", "UP035", "UP045"]
# `IterQueryResult.next` is public API predating the A003 rule; `__next__`/`__anext__`
# alias it on purpose.
"asynch/proto/result.py" = ["A003"]
"benchmark/*.py" = ["ERA", "S", "T20"]
"tests/*.py" = ["ERA", "S"]
